<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore courses and build a semester shortlist with Smart STARS."
    />
    <title>Smart STARS — Course Explorer</title>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("smart-stars-theme") === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
